name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      configuration:
        description: Xcode build configuration
        type: string
        default: Debug

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Tests and iOS builds
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test, build and package
        run: bash scripts/ci_build.sh "$BUILD_CONFIGURATION" "$RUNNER_TEMP/dreeve-build"
      - name: Upload build packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dreeve-${{ github.sha }}-${{ env.BUILD_CONFIGURATION }}
          path: ${{ runner.temp }}/dreeve-build/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ github.sha }}-${{ env.BUILD_CONFIGURATION }}
          path: ${{ runner.temp }}/dreeve-build/logs/
          if-no-files-found: warn
          retention-days: 14
